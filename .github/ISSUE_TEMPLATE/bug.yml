name: Bug report
description: Something the Jira plugin does wrong.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not put a credential, a token, an issue's content or a person's data in an issue. Report a vulnerability
        through the process in SECURITY.md.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version in package.json, or the release tag you installed.
      placeholder: "0.0.0"
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: The release `/jira` and `status` report, such as 2.4.1.
      placeholder: "2.4.1"
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Account alias
      description: The alias you passed, such as work or personal.
      placeholder: "work"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: 'What you did with getJiraIssue, events_list or another tool, the Jira key such as PROJ-42, what you expected, and what the plugin answered. Paste the error''s `CODE: … Next step: …` line.'
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: '`/jira` output'
      description: Paste what `/jira` printed (it names every alias, the access rules and the next step). Remove any credential or personal data first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: check
    attributes:
      label: The check result
      description: Paste `npx plugin-kit check` if you can run it.
      render: shell
    validations:
      required: false
